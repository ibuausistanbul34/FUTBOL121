kind = "web"
previewPath = "/"
title = "Boş Web Projesi"
description = "HTML, CSS ve JavaScript ile yeni web projelerine başlamak için sade bir başlangıç noktası."
version = "1.0.0"
id = "artifacts/vanilla-web-starter"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19657

[services.development]
run = "pnpm --filter @workspace/vanilla-web-starter run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/vanilla-web-starter", "run", "build" ]
serve = "static"
publicDir = "artifacts/vanilla-web-starter/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19657"
BASE_PATH = "/"
